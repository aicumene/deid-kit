[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deid-kit"
version = "0.1.0"
description = "Reversible, per-scope de-identification: a salted token vault with name variants and an out-of-band glossary, a privacy gateway with audit, and a re-identification probe."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alexandra Bernadotte" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# PresidioDetector and the gateway's default redactor import these lazily; install this extra
# only if Presidio is the detector/redactor (plus a spaCy model, e.g. en_core_web_sm).
presidio = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
