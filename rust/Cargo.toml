[package]
name = "deidkit"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "deid-kit in Rust: the vault, deid-proxy and deid-agent, behaving as the Python package does"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.11"
hex = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
toml = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "io-std", "time", "sync", "fs", "process", "signal"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
serde = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[[bin]]
name = "deid-proxy"
path = "src/bin/deid_proxy.rs"
