[package]
name = "deidkit"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "deid-kit in Rust: the vault, deid-proxy and deid-agent, behaving as the Python package does"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.11"
hex = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
toml = "1"
libc = "0.2"

[dev-dependencies]
serde = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
